<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToYou ❤️</title>
  <meta name="theme-color" content="#ffffff">

  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ToYou ❤️" />
  <link rel="apple-touch-icon" href="icon.png" />

  <link rel="manifest" href="manifest.json" />

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
      background: #fff;
    }
    .header {
      font-size: 32px;
      font-weight: bold;
      color: #111;
    }
    .message {
      font-size: 18px;
      max-width: 600px;
      margin: 20px auto;
      color: #444;
    }
    #installBox {
      display: none;
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 20px;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
    }
    #installBtn {
      margin-left: 10px;
      padding: 8px 14px;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">ToYou ❤️</div>
  <div class="message">
    Anonymous messages made simple. This page is a working PWA demo.
  </div>

  <!-- Install banner -->
  <div id="installBox">
    Install ToYou?
    <button id="installBtn">Install</button>
  </div>

  <script>
    /* ---------------------------
       Register REAL service worker
       --------------------------- */
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("SW registered"))
        .catch(err => console.error("SW failed", err));
    }

    /* ---------------------------
       Handle install prompt
       --------------------------- */
    let deferredPrompt;
    const box = document.getElementById("installBox");
    const btn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;

      console.log("PWA install available");

      box.style.display = "block"; // Show bottom banner
    });

    btn.addEventListener("click", async () => {
      box.style.display = "none";
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      console.log("User choice:", choice.outcome);
      deferredPrompt = null;
    });

    /* ---------------------------
       Manual install hint for iOS
       --------------------------- */
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;

    if (isIOS && !isStandalone) {
      setTimeout(() => {
        alert("👉 Tap Share → Add to Home Screen to install.");
      }, 2000);
    }
  </script>

</body>
</html>
