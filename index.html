<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToYou ❤️ Demo PWA</title>
  <meta name="theme-color" content="#ffffff">

  <!-- iOS support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ToYou❤️" />
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    .header {
      font-size: 32px;
      font-weight: bold;
      color: #222;
    }
    .message {
      font-size: 18px;
      max-width: 600px;
      margin: 20px auto;
      color: #444;
    }
    .install-msg {
      margin-top: 50px;
      font-size: 14px;
      color: gray;
    }
  </style>
</head>
<body>

  <div class="header">📬 ToYou ❤️</div>
  <div class="message">
    Write and send anonymous messages to people you've never dared to message before.
    This is just a demo of a working PWA in a single file. 😊
  </div>

  <div class="install-msg">You can install this app on your device!</div>

  <script>
    /* ✅ Manifest as Inline Blob */
    const manifest = {
      name: "ToYou ❤️",
      short_name: "ToYou",
      start_url: ".",
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#ffffff",
      icons: [
        {
          src: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAIAAAAiVQ9NAAAABGdBTUEAALGPC/xhBQAAACBjSFJNAAB6JgAAgIQAAPoAAACA6AAAdTAAAOpgAAA6mAAAF3CculE8AAAAx0lEQVR42u3QQQqAIBAEQdP+/7+hAy0mQZmZvkPfuvBHQAAAAAAAAAAACAjpQbWSurR5Xrb1nlQoXIRoE6ZiS/ZdEygOB/BiW7r9jK8zRXp8xGkphMgTIDqZogkCA6kaIMAgOpmgCQIDqZogkCA6kaIMAgOpmgCQIDqZogkCA6kaIMAgOpmgCQIDqZogkCA6kaIMAgOpmgCQIDqZogkCA6kaIMAgOpmgCQIDqZogkCA6kaIMAgOppDnJwvRD2vB0AAAAAAAAAAADwAPIB9uT6aCIFAAAAAElFTkSuQmCC",
          type: "image/png",
          sizes: "192x192"
        }
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    const manifestURL = URL.createObjectURL(manifestBlob);
    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    manifestLink.href = manifestURL;
    document.head.appendChild(manifestLink);
  </script>

  <script>
    /* ✅ Inline Minimal Service Worker */
    const swCode = `
      self.addEventListener('install', e => self.skipWaiting());
      self.addEventListener('activate', e => self.clients.claim());
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(response => {
            return response || fetch(e.request);
          }).catch(() => new Response('Offline fallback!'))
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('✅ Service Worker registered'))
        .catch(err => console.warn('❌ SW registration failed', err));
    }
  </script>

  <script>
    /* ✅ Custom Install Prompt Handling (Chrome / Android) */
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('[PWA] Install prompt available');
      alert("✅ You can install this as an app! You'll see an option to 'Add to Home screen' soon.");
      deferredPrompt.prompt();
    });
  </script>

  <script>
    /* ✅ iOS Manual Install Tip */
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    if (isIOS && !isStandalone && isSafari) {
      setTimeout(() => {
        alert("👉 To install: Tap Share → 'Add to Home Screen'");
      }, 2000);
    }
  </script>

</body>
</html>
